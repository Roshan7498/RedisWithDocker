# -------------------------------------------------------------------
# 🔷 Application
# -------------------------------------------------------------------
spring.application.name=demoForRedis

# -------------------------------------------------------------------
# 🔷 DataSource (MySQL in Docker)
#   - 'mysql' is the Docker service name from docker-compose.yml
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://mysql:3306/appdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=app
spring.datasource.password=app

# -------------------------------------------------------------------
# 🔷 JPA / Hibernate
#   - 'update' keeps schema changes without dropping data
#   - set 'create' only once if you want Hibernate to rebuild the table
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# -------------------------------------------------------------------
# 🔷 HikariCP (Connection Pool)
# -------------------------------------------------------------------
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initializationFailTimeout=0

# -------------------------------------------------------------------
# 🔷 Redis (Docker service: redis)
# -------------------------------------------------------------------
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=5000

# -------------------------------------------------------------------
# 🔷 SQL initialization (optional)
#   - Disable schema.sql to avoid overwriting Hibernate tables
# -------------------------------------------------------------------
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# -------------------------------------------------------------------
# 🔷 Logging
# -------------------------------------------------------------------
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=trace

# -------------------------------------------------------------------
# 🔷 Actuator / Health
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.redis.show-details=always
management.health.db.show-details=always
management.health.diskspace.show-details=always
